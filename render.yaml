databases:
  - name: apiwise-db
    databaseName: apiwise
    user: apiwise_user
    plan: free

services:
  # Spring Boot 3 Backend
  - type: web
    name: apiwise-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: apiwise-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ALLOW_LOOPBACK_REQUESTS
        value: "false"

  # React 18 Static Frontend
  - type: web
    name: apiwise-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
